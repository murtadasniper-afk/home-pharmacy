<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#137547">
<title>صيدلية المنزل</title>

<style>
:root{
--green:#137547;
--dark:#075b36;
--light:#e7f5ec;
--bg:#f5f8f6;
--white:#fff;
--text:#1c3026;
--muted:#78877e;
--border:#e3ebe5;
--red:#d94747
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,Arial,sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
outline:2px solid var(--green);
outline-offset:2px
}
[hidden]{display:none!important}

.app{
width:100%;
max-width:600px;
min-height:100vh;
margin:auto;
background:var(--bg);
padding-bottom:90px
}

/* رأس الصفحة مع خلفية الأدوية */
header{
padding:18px 18px 22px;
color:white;
background:
linear-gradient(115deg,rgba(5,91,54,.88),rgba(19,117,71,.72)),
url('https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=1200&q=85')
center/cover;
border-radius:0 0 25px 25px
}
.header-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}
.brand{
display:flex;
align-items:center;
gap:10px;
min-width:0
}
.brand-logo{
width:48px;
height:48px;
display:grid;
place-items:center;
flex-shrink:0;
border-radius:16px;
background:white;
color:var(--green);
font-size:28px
}
.brand-name{font-size:19px;font-weight:900}
.brand-subtitle{
margin-top:3px;
font-size:11px;
color:#e4f7eb
}
.language-btn{
flex-shrink:0;
border:1px solid #ffffff70;
border-radius:11px;
padding:8px 11px;
background:#ffffff18;
color:white
}
.welcome{margin-top:22px}
.welcome h1{
margin:0 0 8px;
font-size:25px;
line-height:1.5
}
.welcome p{
margin:0;
color:#e4f7eb;
font-size:13px;
line-height:1.8
}
.search-wrap{position:relative;margin-top:19px}
.search-wrap input{
width:100%;
padding:15px 44px 15px 14px;
border:0;
border-radius:15px;
background:white;
color:var(--text);
font-size:14px
}
.search-icon{
position:absolute;
top:50%;
transform:translateY(-50%);
right:15px;
color:var(--muted)
}

/* الأقسام */
main{padding:20px 15px}
.section-heading{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:14px
}
.section-heading h2{margin:0;font-size:18px}
.section-heading small{color:var(--muted);font-size:12px}
.categories{
display:flex;
gap:9px;
overflow-x:auto;
padding:2px 1px 9px;
scrollbar-width:none
}
.categories::-webkit-scrollbar{display:none}
.category{
flex-shrink:0;
min-width:86px;
padding:13px 9px;
border:1px solid var(--border);
border-radius:15px;
background:white;
color:var(--text);
text-align:center
}
.category .emoji{
display:block;
font-size:24px;
margin-bottom:7px
}
.category span:last-child{
font-size:12px;
font-weight:750
}
.category.active{
color:var(--dark);
background:var(--light);
border-color:#a7d8b8
}

/* بطاقة العناية */
.promo{
margin:15px 0 25px;
padding:17px;
border-radius:18px;
background:linear-gradient(120deg,#e0f5e6,#f0faf2);
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
overflow:hidden
}
.promo h3{margin:0 0 7px;font-size:17px}
.promo p{
margin:0;
color:var(--muted);
font-size:12px;
line-height:1.8
}
.promo-icon{font-size:48px;flex-shrink:0}

/* المنتجات */
.product-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px
}
.product-card{
min-width:0;
overflow:hidden;
border:1px solid var(--border);
border-radius:17px;
background:white
}
.product-image{
position:relative;
height:125px;
display:grid;
place-items:center;
background:#edf6ef;
font-size:53px
}
.product-badge{
position:absolute;
top:9px;
right:8px;
padding:4px 7px;
border-radius:7px;
background:#fff0dc;
color:#995315;
font-size:10px;
font-weight:800
}
.product-info{padding:11px}
.product-name{
min-height:38px;
margin:0 0 5px;
font-size:13px;
line-height:1.6;
font-weight:850
}
.product-description{
min-height:17px;
margin-bottom:9px;
color:var(--muted);
font-size:10px
}
.product-bottom{
display:flex;
align-items:center;
justify-content:space-between;
gap:5px
}
.product-price{
font-size:14px;
font-weight:900;
color:var(--green)
}
.add-btn{
width:35px;
height:35px;
border:0;
border-radius:11px;
background:var(--green);
color:white;
font-size:21px
}
.empty-state{
grid-column:1/-1;
padding:30px 10px;
color:var(--muted);
text-align:center
}

/* المعلومات */
.info-box{
margin-top:23px;
padding:15px;
border:1px solid var(--border);
border-radius:15px;
background:white
}
.info-box h3{margin:0 0 8px;font-size:14px}
.info-box p{
margin:0;
color:var(--muted);
font-size:12px;
line-height:1.9
}

/* بيانات المطور */
footer{
padding:15px 15px 22px;
text-align:center;
color:var(--muted);
font-size:11px;
line-height:1.8
}
.developer-credit{
margin-top:13px;
color:var(--muted);
font-size:11px;
line-height:1.65
}
.developer-name{
font-size:11px;
font-weight:700;
color:var(--text)
}
.developer-phone{
font-size:11px;
font-weight:700;
color:var(--green);
direction:ltr;
display:inline-block
}

/* شريط التنقل */
.bottom-nav{
position:fixed;
z-index:10;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:600px;
display:grid;
grid-template-columns:repeat(4,1fr);
padding:9px 5px calc(9px + env(safe-area-inset-bottom));
border-top:1px solid var(--border);
background:#ffffffef;
backdrop-filter:blur(12px)
}
.nav-btn{
position:relative;
border:0;
background:transparent;
color:var(--muted);
font-size:10px;
padding:5px 2px
}
.nav-btn .nav-icon{
display:block;
margin-bottom:5px;
font-size:21px
}
.nav-btn.active{
color:var(--green);
font-weight:900
}
.cart-count{
position:absolute;
top:0;
left:calc(50% + 5px);
min-width:17px;
height:17px;
display:none;
place-items:center;
border-radius:50%;
background:var(--red);
color:white;
font-size:10px
}

/* الصفحات الداخلية */
.page{display:none}
.page.active{display:block}
.cart-line{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:13px 0;
border-bottom:1px solid var(--border)
}
.cart-line strong{font-size:13px}
.cart-line small{
display:block;
margin-top:5px;
color:var(--muted)
}
.qty-controls{
display:flex;
align-items:center;
gap:8px
}
.qty-controls button{
width:29px;
height:29px;
border:1px solid var(--border);
border-radius:9px;
background:white
}
.total-row{
display:flex;
justify-content:space-between;
margin:20px 0;
font-weight:900
}
.form-field{
display:block;
width:100%;
margin:12px 0;
padding:13px;
border:1px solid var(--border);
border-radius:12px;
background:white;
color:var(--text)
}
.action-btn{
width:100%;
padding:14px;
border:0;
border-radius:13px;
background:var(--green);
color:white;
font-weight:850
}
.secondary-btn{
width:100%;
padding:12px;
margin-top:9px;
border:1px solid var(--border);
border-radius:12px;
background:white;
color:var(--text)
}
.notice{
margin:12px 0;
padding:12px;
border-radius:12px;
background:var(--light);
color:var(--dark);
font-size:12px;
line-height:1.8
}
.ltr{direction:ltr;text-align:left}

/* شاشة الدخول */
.welcome-screen{
position:fixed;
inset:0;
z-index:100;
background:
linear-gradient(140deg,rgba(4,75,44,.72),rgba(12,105,63,.62)),
url('https://images.unsplash.com/photo-1576602976047-174e57a47881?auto=format&fit=crop&w=1200&q=85')
center/cover;
display:flex;
align-items:center;
justify-content:center;
padding:22px
}
.welcome-card{
width:100%;
max-width:410px;
background:rgba(255,255,255,.96);
border-radius:26px;
padding:27px 22px;
text-align:center;
box-shadow:0 20px 60px #003d2540
}
.welcome-logo{
width:70px;
height:70px;
margin:0 auto 15px;
border:2px solid #9bcdb0;
border-radius:20px;
display:grid;
place-items:center;
color:var(--green);
font-size:43px
}
.welcome-card h1{
font-size:23px;
margin:0 0 7px;
color:var(--dark)
}
.welcome-card p{
font-size:13px;
line-height:1.8;
color:var(--muted);
margin:0 0 22px
}
.welcome-card .action-btn{margin-bottom:9px}
.welcome-card .secondary-btn{
margin-top:0;
border-color:#8bc5a1;
color:var(--dark);
font-weight:800
}
.welcome-small{
font-size:10px;
color:var(--muted);
margin-top:14px
}
.auth-panel{
display:none;
margin-top:15px;
text-align:right
}
.auth-panel.visible{display:block}
.auth-panel h3{font-size:15px;margin:0 0 8px}
.auth-panel .form
